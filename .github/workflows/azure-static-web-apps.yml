name: Azure Static Web Apps Placeholder CI/CD

on:
  # Deploy on changes to main branch.
  push:
    branches:
      - main
  # Build preview environments for pull requests.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    # For PRs, deploy only while PR is open.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy (Placeholder)
    steps:
      # Checkout current repository content.
      - name: Checkout
        uses: actions/checkout@v4

      # Deploy static site using Azure Static Web Apps action.
      # NOTE: This is a placeholder secret name. Create it in:
      # GitHub repo > Settings > Secrets and variables > Actions
      # Secret name example: AZURE_STATIC_WEB_APPS_API_TOKEN_PLACEHOLDER
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PLACEHOLDER }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "apps/web"
          output_location: ""
          # Deployment config file lives in infra/azure.
          config_file_location: "infra/azure"

  close_pull_request_preview:
    # Close temporary preview environment after PR is closed.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Preview
    steps:
      - name: Close Preview Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Same placeholder token as above.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PLACEHOLDER }}
          app_location: "apps/web"
          action: close
